<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>灵屏 LumaSign</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #1a1c22 0%, #0e0f13 60%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6e7ea;
  }
  .card { text-align: center; user-select: none; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 18px;
    box-shadow: 0 10px 30px rgba(37,99,235,0.35);
  }
  .title { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { margin-top: 6px; font-size: 13px; color: #8a8d96; }
  .spin {
    margin: 22px auto 0; width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #5b8cff;
    animation: r 0.8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient></defs>
        <rect width="100" height="100" rx="22" fill="url(#lg)"/><rect x="16" y="16" width="68" height="68" rx="9" fill="#fff"/><rect x="30" y="30" width="40" height="40" rx="5" fill="url(#cg)"/><rect x="38" y="47" width="24" height="5" rx="2.5" fill="#fff"/>
      </svg>
    </div>
    <div class="title">灵屏 LumaSign</div>
    <div class="sub">正在启动局域网数字标牌服务…</div>
    <div class="spin"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>灵屏 LumaSign</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #1a1c22 0%, #0e0f13 60%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6e7ea;
  }
  .card { text-align: center; user-select: none; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(145deg, #5b8cff, #9d6bff);
    box-shadow: 0 10px 30px rgba(91,140,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff;
  }
  .title { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { margin-top: 6px; font-size: 13px; color: #8a8d96; }
  .spin {
    margin: 22px auto 0; width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #5b8cff;
    animation: r 0.8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">灵</div>
    <div class="title">灵屏 LumaSign</div>
    <div class="sub">正在启动局域网数字标牌服务…</div>
    <div class="spin"></div>
  </div>
</body>
</html>

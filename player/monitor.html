<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>灵屏 · 监看墙</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070a10; color: #e7ecf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 22px;
      background: rgba(255,255,255,.03); border-bottom: 1px solid rgba(255,255,255,.07); }
    header .logo { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    header .logo span { color: #4f9dff; }
    header .stat { font-size: 14px; color: #9aa6b6; }
    header .clock { margin-left: auto; font-size: 15px; color: #cdd6e3; font-variant-numeric: tabular-nums; }
    #grid { flex: 1; overflow: auto; padding: 18px; display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-content: start; }
    .card { background: #0e131c; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; overflow: hidden;
      box-shadow: 0 6px 22px rgba(0,0,0,.35); }
    .card.off { opacity: .55; }
    .shot { position: relative; aspect-ratio: 16/9; background: #05070c; display: flex; align-items: center; justify-content: center; }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot .ph { color: #5b6678; font-size: 13px; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #5b6678; flex: none; }
    .dot.on { background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.22); }
    .dot.off { background: #f87171; }
    .name { font-weight: 600; font-size: 15px; }
    .code { margin-left: auto; font-size: 12px; color: #6b7686; font-family: ui-monospace, monospace; }
    .meta { padding: 2px 12px 12px; }
    .playing { font-size: 13px; color: #dbe3ee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub { font-size: 12px; color: #6b7686; margin-top: 3px; }
    .err { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #3a1d1d;
      color: #ffb4b4; padding: 8px 16px; border-radius: 10px; font-size: 13px; display: none; }
    .empty { grid-column: 1/-1; text-align: center; color: #6b7686; padding: 80px 20px; }
    .install-btn { margin-left: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(79,157,255,.14);
      color: #cfe2ff; padding: 6px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; display: none; }
    .install-btn:hover { background: rgba(79,157,255,.26); }
    @media (max-width: 640px) {
      #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
      header { padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
      header .logo { font-size: 17px; }
      .name { font-size: 13px; } .playing { font-size: 12px; } .sub { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">灵屏 <span>监看墙</span></div>
      <div class="stat" id="stat">连接中...</div>
      <div class="clock" id="clock">--:--:--</div>
      <button id="installBtn" class="install-btn">安装到主屏幕</button>
    </header>
    <div id="grid"></div>
  </div>
  <div class="err" id="err"></div>
  <script src="monitor.js"></script>
  <script>
    // PWA：注册 Service Worker（离线打开 + 上次截屏兜底）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/player/sw.js').catch(() => {}));
    }
    // 安装到主屏幕提示
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; installBtn.style.display = '';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null; installBtn.style.display = 'none';
    });
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
  </script>
</body>
</html>

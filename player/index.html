<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>灵屏播放器 · LumaSign Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="welcome" class="welcome hidden"></div>
  <div id="fallback" class="fallback hidden"></div>
  <!-- 双轨加载：现代浏览器走 ES Module 引擎；Android 4.4 等老 WebView（Chromium 33，
       不支持 type="module"，会静默跳过 module 脚本）忽略 nomodule 属性，按经典脚本执行 ES5 降级引擎 -->
  <script type="module" src="engine.js"></script>
  <script nomodule src="engine.legacy.js"></script>
</body>
</html>

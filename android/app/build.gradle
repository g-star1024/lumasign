apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.lumasign.player'
    compileSdk 34

    def keystorePropsFile = rootProject.file('keystore.properties')

    defaultConfig {
        applicationId 'com.lumasign.player'
        minSdk 19
        targetSdk 34
        versionCode 19
        versionName '1.3.13'
        // coreLibraryDesugaring 要求：minSdk < 21 时必须启用 multidex
        // desugar_jdk_libs 注入的方法数会超过 Dalvik 65K 限制
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 核心 library 脱糖：让 Java 8+ API（java.time、Stream、Optional 等）
        // 在 minSdk 19 (Android 4.4) 的 Dalvik/ART 上可用。
        // Kotlin stdlib 1.9.x 内部会间接使用这些 API，不加此项在低版本设备上
        // 可能触发 NoSuchMethodError / NoClassDefFoundError。
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    // ── 多版本 APK：按 CPU 架构拆分，兼容新旧设备 ──
    // 产物示例：app-armeabi-v7a-release.apk（32位老设备如 rk312x/Android 4.4）
    //         app-arm64-v8a-release.apk   （64位现代设备）
    //         app-x86-release.apk         （x86，仅供 Android Studio 模拟器本地测试用）
    //         app-universal-release.apk     （全架构合一，体积大但省心）
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86'   // 覆盖 99%+ 安卓标牌设备；x86 用于本地模拟器（API 19）测试
            universalApk true                       // 额外输出一个 universal 包
        }
    }

    // versionCode 自动按 ABI 偏移，避免 Google Play / 更新检测冲突
    project.ext.versionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 4, 'universal': 3]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def baseVersionCode = project.ext.versionCodes.get(output.getFilter(
                com.android.build.OutputFile.ABI
            ), 0)
            output.versionCodeOverride = defaultConfig.versionCode * 10 + baseVersionCode
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    // multidex：coreLibraryDesugaring + minSdk 19 必需（Dalvik 65K 方法数限制）
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

# 灵屏 LumaSign · Android APK CI/CD
# 触发：push to main / PR / tag / 手动触发
# 产物：debug APK + release APK (signed with debug key)

name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'player/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'player/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Get version
        id: version
        run: |
          VER=$(grep "versionName" android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Android version: $VER"

      - name: Build Debug APK
        id: build-debug
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build-output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=${BUILD_EXIT}" >> "$GITHUB_OUTPUT"
          exit ${BUILD_EXIT}

      - name: "🔴 编译错误详情 (请查看此步骤)"
        if: always()
        working-directory: android
        run: |
          echo "############ MANIFEST 合并报告 (ERROR/WARNING 部分) ############"
          if [ -f build/outputs/logs/manifest-merger-debug-report.txt ]; then
            grep -i -E "error|warning|conflict|fail|exception" build/outputs/logs/manifest-merger-debug-report.txt | head -60 || echo "(无 error/warning 关键字)"
          else
            echo "(manifest 报告不存在)"
          fi
          
          echo ""
          echo "############ GRADLE 输出中的 Kotlin 编译错误 ############"
          grep -i -E "e: |error:|FAILED|Exception|Unresolved|Cannot find|Type mismatch" /tmp/build-output.log | head -80 || echo "(无编译错误关键字)"
          
          echo ""
          echo "############ GRADLE 输出末尾 100 行 ############"
          tail -100 /tmp/build-output.log

      - name: "📨 把编译错误回贴到 commit comment（供离线排查）"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          EXIT_CODE="${{ steps.build-debug.outputs.BUILD_EXIT_CODE }}"
          if [ "${EXIT_CODE:-0}" = "0" ]; then
            echo "BUILD_EXIT_CODE=${EXIT_CODE} -> build 成功，无需回贴。"
            exit 0
          fi
          {
            echo "## ❌ Android APK 构建失败（commit ${SHA}）"
            echo ""
            echo "### Kotlin / Gradle 编译错误"
            echo '```'
            grep -i -E "e: |error:|FAILED|Exception|Unresolved|Cannot find|Type mismatch|expected |required " /tmp/build-output.log | head -100
            echo '```'
            echo ""
            echo "<details><summary>Gradle 末尾 120 行</summary>"
            echo ""
            echo '```'
            tail -120 /tmp/build-output.log
            echo '```'
            echo "</details>"
          } > /tmp/comment.md
          BODY=$(python3 -c "import json,sys; sys.stdout.write(json.dumps(open('/tmp/comment.md').read()))")
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"body\": ${BODY}}" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/comments"
          echo "已回贴编译错误到 commit comment。"

      - name: Upload full build directory for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-debug-v${{ steps.version.outputs.version }}
          path: |
            android/app/build/
            /tmp/build-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Rename APKs with version
        run: |
          VER="${{ steps.version.outputs.version }}"
          shopt -s nullglob
          count=0
          for f in android/app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then
              base=$(basename "$f" .apk)
              abi=$(echo "$base" | sed 's/^app-//;s/-debug$//')
              mv "$f" "android/app/build/outputs/apk/debug/LumaSign-android-v$VER-${abi}.apk"
              count=$((count + 1))
            fi
          done
          echo "Renamed $count debug APK(s)"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No debug APKs found"
            ls -laR android/app/build/outputs/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-android-debug-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          overwrite: true

      # Release build requires signing key; this uses debug key for CI
      - name: Build Release APK (debug-signed)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore /tmp/ci-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ci-debug \
            -storepass android \
            -keypass android \
            -dname "CN=LumaSign CI, OU=CI, O=LumaSign, L=CI, ST=CI, C=US"

          cat > keystore.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=ci-debug
          storeFile=/tmp/ci-keystore.jks
          EOF

          ./gradlew assembleRelease

      - name: Rename Release APKs with version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ steps.version.outputs.version }}"
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=$(echo "$base" | sed 's/^app-//;s/-release$//')
            mv "$f" "android/app/build/outputs/apk/release/LumaSign-android-v$VER-${abi}-release.apk"
          done

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-android-release-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/**/*.apk
          retention-days: 30
          overwrite: true

  # Tag push → 自动发布到 GitHub Releases
  release:
    name: Publish to Releases
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: |
          VER=$(grep "versionName" android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          body: |
            ## 📦 安卓 APK 架构选择指南
            - **32 位老设备（瑞芯微 rk312x / 全志 / Android 4.4–5.1）**：下载 `*-armeabi-v7a.apk` 或 `*-universal.apk`
            - **64 位设备（Android 6.0+ 主流板卡）**：下载 `*-arm64-v8a.apk`
            - **不确定设备架构 / 想省心**：优先 `*-universal.apk`（体积较大但兼容全部架构）

            > ⚠️ 文件名含 `-unsigned` 的旧包为未签名产物，无法安装，请勿下载；正式包均已正确签名。

            ## 🖥️ 桌面端
            - Windows：下载 `*-win-x64*.exe`（安装版）或 `*.zip`（便携版）
            - macOS：下载 `*-macos-*.dmg`

            ---
            完整更新内容见下方自动生成的 Release Notes。

# 灵屏 LumaSign · Android APK CI/CD
# 触发：push to main / PR / tag / 手动触发
# 产物：debug APK + release APK (signed with debug key)

name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'player/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'player/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Android requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Get version
        id: version
        run: |
          VER=$(grep "versionName" android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Android version: $VER"

      - name: Setup Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            GRADLE_ZIP="/tmp/gradle-8.7-bin.zip"

            # Try download + validate zip magic bytes (PK = 504b)
            try_download() {
              local url="$1" mode="$2"
              local curl_args=()
              if [ "$mode" = "direct" ]; then
                curl_args=(--noproxy '*')
              fi
              echo "Trying [$mode]: $url"
              curl -sL --connect-timeout 20 --max-time 300 --fail "${curl_args[@]}" -o "$GRADLE_ZIP" "$url"
              if [ ! -s "$GRADLE_ZIP" ]; then
                rm -f "$GRADLE_ZIP"
                return 1
              fi
              local magic
              magic=$(xxd -l 2 -p "$GRADLE_ZIP" 2>/dev/null || od -A n -t x1 -N 2 "$GRADLE_ZIP" | tr -d ' ')
              if [ "$magic" != "504b" ]; then
                echo "  -> invalid zip (magic=$magic), skipping"
                rm -f "$GRADLE_ZIP"
                return 1
              fi
              echo "  -> OK ($magic, $(stat -c%s "$GRADLE_ZIP" 2>/dev/null) bytes)"
              return 0
            }

            for url in \
              "https://mirrors.tuna.tsinghua.edu.cn/gradle/gradle-8.7-bin.zip" \
              "https://mirrors.aliyun.com/gradle/gradle-8.7-bin.zip" \
              "https://mirrors.cloud.tencent.com/gradle/distributions/gradle-8.7-bin.zip"; do
              if try_download "$url" "direct"; then break; fi
            done

            if [ ! -s "$GRADLE_ZIP" ]; then
              for url in \
                "https://services.gradle.org/distributions/gradle-8.7-bin.zip"; do
                if try_download "$url" "proxy"; then break; fi
              done
            fi

            if [ ! -s "$GRADLE_ZIP" ]; then
              echo "FATAL: Could not download Gradle from any source"
              exit 1
            fi

            unzip -q "$GRADLE_ZIP" -d /tmp/
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Validate Gradle wrapper
        run: |
          cd android
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APKs with version
        run: |
          VER="${{ steps.version.outputs.version }}"
          for f in android/app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f" .apk)
            # base is like "app-armeabi-v7a-debug" -> extract ABI part
            abi=$(echo "$base" | sed 's/^app-//;s/-debug$//')
            mv "$f" "android/app/build/outputs/apk/debug/LumaSign-android-v$VER-${abi}.apk"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-android-debug-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          overwrite: true

      # Release build requires signing key; this uses debug key for CI
      # For production, configure secrets: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build Release APK (debug-signed)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          # Create a temporary keystore for CI signing (NOT for production!)
          keytool -genkeypair \
            -v \
            -keystore /tmp/ci-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ci-debug \
            -storepass android \
            -keypass android \
            -dname "CN=LumaSign CI, OU=CI, O=LumaSign, L=CI, ST=CI, C=US"
          
          # 注意：build.gradle 读取的是 rootProject/keystore.properties
          # （不是 local.properties），写错文件会导致 release 包完全未签名、无法安装
          cat > keystore.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=ci-debug
          storeFile=/tmp/ci-keystore.jks
          EOF
          
          ./gradlew assembleRelease

      - name: Rename Release APKs with version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ steps.version.outputs.version }}"
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            abi=$(echo "$base" | sed 's/^app-//;s/-release$//')
            mv "$f" "android/app/build/outputs/apk/release/LumaSign-android-v$VER-${abi}-release.apk"
          done

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-android-release-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/**/*.apk
          retention-days: 30
          overwrite: true

  # Tag push → 自动发布到 GitHub Releases
  release:
    name: Publish to Releases
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: |
          VER=$(grep "versionName" android/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          body: |
            ## 📦 安卓 APK 架构选择指南
            - **32 位老设备（瑞芯微 rk312x / 全志 / Android 4.4–5.1）**：下载 `*-armeabi-v7a.apk` 或 `*-universal.apk`
            - **64 位设备（Android 6.0+ 主流板卡）**：下载 `*-arm64-v8a.apk`
            - **不确定设备架构 / 想省心**：优先 `*-universal.apk`（体积较大但兼容全部架构）

            > ⚠️ 文件名含 `-unsigned` 的旧包为未签名产物，无法安装，请勿下载；正式包均已正确签名。

            ## 🖥️ 桌面端
            - Windows：下载 `*-win-x64*.exe`（安装版）或 `*.zip`（便携版）
            - macOS：下载 `*-macos-*.dmg`

            ---
            完整更新内容见下方自动生成的 Release Notes。

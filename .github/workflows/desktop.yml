# 灵屏 LumaSign · 桌面端 CI/CD
# 触发：push to main / PR to main / 手动触发
# 产物：Windows (.exe, .msi) + macOS (.dmg, .zip) 桌面端安装包

name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get version
        id: version
        run: |
          node -e "
            const fs = require('fs');
            let v = require('./package.json').version;
            const ref = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
            if (/^[0-9]+[.][0-9]+[.][0-9]+$/.test(ref)) v = ref;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\n');
            console.log('Version:', v);
          "

      - name: Install desktop dependencies
        run: npm install --save-dev electron@25.9.0 electron-builder@23.6.0
        working-directory: ${{ github.workspace }}

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}

      - name: Rename artifacts with version
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Get-ChildItem dist/*.exe | ForEach-Object { Rename-Item $_ "LumaSign-win-x64-v$ver.exe" }
          Get-ChildItem dist/*.msi | ForEach-Object { Rename-Item $_ "LumaSign-win-x64-v$ver.msi" }
          Get-ChildItem dist/*.zip | ForEach-Object { Rename-Item $_ "LumaSign-win-x64-v$ver.zip" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-windows-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  build-mac:
    name: macOS (x64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get version
        id: version
        run: |
          node -e "
            const fs = require('fs');
            let v = require('./package.json').version;
            const ref = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
            if (/^[0-9]+[.][0-9]+[.][0-9]+$/.test(ref)) v = ref;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\n');
            console.log('Version:', v);
          "

      - name: Install desktop dependencies
        run: npm install --save-dev electron@25.9.0 electron-builder@23.6.0
        working-directory: ${{ github.workspace }}

      # 预清理：macOS runner 可能存在残留挂载点，提前卸载避免 hdiutil Resource busy
      - name: Pre-build disk cleanup
        run: |
          hdiutil detach -all -force 2>/dev/null || true
          sleep 1

      - name: Build macOS app (Intel)
        run: |
          npx electron-builder --mac --x64 --publish never && echo "BUILD_OK" || {
            EXIT_CODE=$?
            echo "::warning::Intel DMG 构建失败(exit $EXIT_CODE)，降级为仅 ZIP..."
            hdiutil detach -all -force 2>/dev/null || true
            sleep 1
            npx electron-builder --mac --x64 -c.mac.target=zip --publish never || exit $EXIT_CODE
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        working-directory: ${{ github.workspace }}

      # 清理：electron-builder 创建 DMG 后会残留挂载的磁盘镜像，
      # 不卸载会导致后续 arm64 构建的 hdiutil detach 报 Resource busy (exit 16)
      - name: Cleanup mounted disk images
        run: |
          hdiutil detach -all -force 2>/dev/null || true
          sleep 2

      - name: Build macOS app (Apple Silicon)
        run: |
          npx electron-builder --mac --arm64 --publish never && echo "BUILD_OK" || {
            EXIT_CODE=$?
            echo "::warning::AppleSilicon DMG 构建失败(exit $EXIT_CODE)，降级为仅 ZIP..."
            hdiutil detach -all -force 2>/dev/null || true
            sleep 1
            npx electron-builder --mac --arm64 -c.mac.target=zip --publish never || exit $EXIT_CODE
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        working-directory: ${{ github.workspace }}

      - name: Rename artifacts with version (keep inside dist/)
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd dist
          shopt -s nullglob
          for f in *.dmg; do
            if [[ "$f" == *arm64* ]]; then mv "$f" "LumaSign-macos-arm64-v$VER.dmg"
            elif [[ "$f" == *x64* ]]; then mv "$f" "LumaSign-macos-x64-v$VER.dmg"
            else mv "$f" "LumaSign-macos-v$VER.dmg"; fi
          done
          for f in *.zip; do
            if [[ "$f" == *arm64* ]]; then mv "$f" "LumaSign-macos-arm64-v$VER.zip"
            elif [[ "$f" == *x64* ]]; then mv "$f" "LumaSign-macos-x64-v$VER.zip"
            else mv "$f" "LumaSign-macos-universal-v$VER.zip"; fi
          done
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-macos-v${{ steps.version.outputs.version }}
          path: |
            dist/LumaSign-macos-*.dmg
            dist/LumaSign-macos-*.zip
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  # 可选：打 Release Tag 时自动发布到 GitHub Releases
  release:
    name: Create Release
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

# 灵屏 LumaSign · 桌面端 CI/CD
# 触发：push to main / PR to main / 手动触发
# 产物：Windows (.exe, .msi) + macOS (.dmg, .zip) 桌面端安装包

name: Desktop Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install desktop dependencies
        run: npm install --save-dev electron@26.6.10 electron-builder@24.6.4
        working-directory: ${{ github.workspace }}

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30

  build-mac:
    name: macOS (x64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install desktop dependencies
        run: npm install --save-dev electron@26.6.10 electron-builder@24.6.4
        working-directory: ${{ github.workspace }}

      - name: Build macOS app (Intel)
        run: npx electron-builder --mac x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        working-directory: ${{ github.workspace }}

      - name: Build macOS app (Apple Silicon)
        run: npx electron-builder --mac arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumasign-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  # 可选：打 Release Tag 时自动发布到 GitHub Releases
  release:
    name: Create Release
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

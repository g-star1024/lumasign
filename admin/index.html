<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>灵屏标牌管理中心 · LumaSign</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    #err-overlay { display:none; position:fixed; inset:0; background:#0e0f13; color:#e54d4d; padding:24px; font:14px/1.6 monospace; z-index:99999; overflow:auto; white-space:pre-wrap; word-break:break-all; }
    #err-overlay.show { display:block; }
  </style>
  <script>
    window.addEventListener('error', function(e) {
      var o = document.getElementById('err-overlay');
      o.textContent = '[JS Error]\n' + (e.message || '') + '\n\nFile: ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n\nStack:\n' + (e.error && e.error.stack || 'N/A');
      o.classList.add('show');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var o = document.getElementById('err-overlay');
      o.textContent = '[Promise Rejection]\n' + (e.reason && (e.reason.message || e.reason.stack || String(e.reason)) || 'N/A');
      o.classList.add('show');
    });
  </script>
</head>
<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-3);font:14px system-ui">Loading...</div></div>
  <div id="toast-wrap" class="toast-wrap"></div>
  <div id="modal-root"></div>
  <div id="err-overlay"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

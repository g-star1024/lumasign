<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="content" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角渐变底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 白色屏幕面板 -->
  <rect x="82" y="82" width="348" height="348" rx="46" fill="#FFFFFF"/>

  <!-- 蓝色节目内容 -->
  <rect x="154" y="154" width="204" height="204" rx="26" fill="url(#content)"/>

  <!-- Luma 光带 -->
  <g filter="url(#glow)">
    <rect x="195" y="240" width="122" height="26" rx="13" fill="#FFFFFF"/>
  </g>
</svg>
